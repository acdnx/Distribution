name: AggregateUploadFileList

# 用途：把 Branch/{branch}/ 下所有 UploadFileList_开头的清单 txt，
#       增量聚合（去重、保留首次出现顺序）到同目录的 UploadFileList.txt，
#       并删除这些已被聚合的分片文件，最后把结果提交回本分支。
#
# 触发：Migration 分支上 Branch/{branch}/UploadFileList_*.txt 发生增删改时。
#       {branch} 不唯一（如 quote、quote-gold 等），脚本逐个目录处理。
#
# 防自触发（三重保险）：
#   1. 本工作流用仓库自带的 GITHUB_TOKEN 推送 —— GitHub 规定 GITHUB_TOKEN
#      产生的事件不会再触发新的 workflow run；
#   2. 提交信息带 [skip ci]，GitHub 对该 push 跳过全部工作流；
#   3. 作业级 if 再校验一次提交信息，兜住有人改成 PAT 推送的情况。
#
# 注意：聚合结果写的是 UploadFileList.txt，不匹配下方的 paths 过滤器
#      （过滤器要求 UploadFileList_ 前缀），但“删除分片”这一步会匹配，
#      故第 1、2 条防自触发是必需的，不是冗余。
on:
  push:
    branches:
      - Migration
    paths:
      - 'Branch/*/UploadFileList_*.txt'
  workflow_dispatch:        # 手动触发：用于补跑历史存量（如当前 quote 目录下待聚合的分片）

permissions:
  contents: write

# 串行化：避免两次几乎同时的推送各自提交后互相把对方顶掉
concurrency:
  group: AggregateUploadFileList-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    steps:
      - name: CheckoutMigration
        uses: actions/checkout@v4
        with:
          ref: Migration
          fetch-depth: 0
          # 默认即 GITHUB_TOKEN；显式写出以强调“用内置 token 推送”这一防自触发前提
          token: ${{ secrets.GITHUB_TOKEN }}

      # 运行参数自证：把触发上下文与实际检出的分支打进日志，便于事后追溯
      - name: WorkflowContext
        run: |
          echo "[INFO] 触发事件   = ${{ github.event_name }}"
          echo "[INFO] 触发 ref   = ${{ github.ref }}"
          echo "[INFO] 触发 SHA   = ${{ github.sha }}"
          echo "[INFO] 操作者     = ${{ github.actor }}"
          echo "[INFO] 运行编号   = #${{ github.run_number }}（第 ${{ github.run_attempt }} 次尝试）"
          echo "[INFO] 实际检出   = $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

      - name: AggregateUploadFileList
        run: |
          python3 - <<'PY'
          # -*- coding: utf-8 -*-
          """把 Branch/{branch}/ 下的 UploadFileList_*.txt 增量聚合进 UploadFileList.txt

          规则：
            - 逐目录（Branch 下的一级子目录，即 {branch}）独立处理；
            - 顺序 = 现有 UploadFileList.txt 的行在前，分片按文件名升序（文件名内嵌
              yyyyMMdd_HHmmssSSS 时间戳，故等价于时间顺序）依次追加；
            - 去重：同一行只保留首次出现；忽略空行；行尾统一 LF；
            - 聚合后删除本次并入的分片文件；无分片则整步跳过（幂等）。

          日志口径（逐文件交代，便于事后核对，不只看汇总数）：
            - 每个目录打印：目标现状（存在与否 / 原有行数）；
            - 每个分片打印：文件名 + 读入行数 / 新增 / 重复 / 空行；
            - 写入目标打印：路径 + 结果行数 / 字节数 / 原行数；
            - 每个被删除的分片都列出文件名。
          """
          import glob
          import os
          import sys

          BASE_DIR = 'Branch'                 # {branch} 的父目录
          TARGET_NAME = 'UploadFileList.txt'  # 聚合目标（注意：不带下划线）
          PART_PREFIX = 'UploadFileList_'     # 分片前缀，其后必为下划线 → 天然不匹配目标文件名

          def read_lines(path):
              """读文本并按行返回（保留空行，交由调用方区分空行/重复）"""
              with open(path, 'r', encoding='utf-8') as fh:
                  return [raw.rstrip('\r\n').strip() for raw in fh]

          def merge_dir(dir_path):
              """聚合单个 {branch} 目录；返回 (是否改动, 并入分片数, 结果行数, 删除文件相对路径列表)"""
              target = os.path.join(dir_path, TARGET_NAME)
              parts = sorted(glob.glob(os.path.join(dir_path, PART_PREFIX + '*.txt')))
              if not parts:
                  print('[SKIP] %s：目录下无 %s*.txt 分片，跳过（不产生提交）'
                        % (dir_path, PART_PREFIX))
                  return False, 0, 0, []

              print('[INFO] %s：发现 %d 个待并入分片，开始聚合' % (dir_path, len(parts)))
              if os.path.isfile(target):
                  base_lines = [line for line in read_lines(target) if line]
                  print('       现有目标 %s：存在，原有 %d 行' % (TARGET_NAME, len(base_lines)))
              else:
                  base_lines = []
                  print('       现有目标 %s：不存在，按空基线处理' % TARGET_NAME)

              seen = set(base_lines)
              lines = list(base_lines)
              print('       按下述顺序并入（文件名升序 = 时间顺序）：')
              for idx, src in enumerate(parts, 1):
                  raw = read_lines(src)
                  added = dup = blank = 0
                  for line in raw:
                      if not line:
                          blank += 1
                      elif line in seen:
                          dup += 1
                      else:
                          seen.add(line)
                          lines.append(line)
                          added += 1
                  print('         %d) %s' % (idx, os.path.basename(src)))
                  print('            读入 %d 行 → 新增 %d 行 / 重复 %d 行 / 空行 %d 行'
                        % (len(raw), added, dup, blank))

              content = ''.join(line + '\n' for line in lines)
              with open(target, 'w', encoding='utf-8', newline='\n') as fh:
                  fh.write(content)
              print('       写入目标 %s：%d 行 / %d 字节（原有 %d 行，净增 %d 行）'
                    % (target, len(lines), len(content.encode('utf-8')),
                       len(base_lines), len(lines) - len(base_lines)))

              removed = []
              for src in parts:
                  os.remove(src)
                  removed.append(src)
              print('       删除已并入分片 %d 个：' % len(removed))
              for src in removed:
                  print('         - %s' % src)
              return True, len(parts), len(lines), removed

          if not os.path.isdir(BASE_DIR):
              print('[INFO] 仓库内无 %s 目录，无需处理' % BASE_DIR)
              sys.exit(0)

          dirs = sorted(d for d in glob.glob(os.path.join(BASE_DIR, '*'))
                        if os.path.isdir(d))
          print('[INFO] 扫描 %s/ 下目录 %d 个：%s'
                % (BASE_DIR, len(dirs),
                   '、'.join(os.path.basename(d) for d in dirs) or '（无）'))
          print('')

          merged_dirs = skipped_dirs = 0
          total_parts = total_lines = 0
          all_removed = []
          for dir_path in dirs:
              changed, part_count, line_count, removed = merge_dir(dir_path)
              if changed:
                  merged_dirs += 1
                  total_parts += part_count
                  total_lines += line_count
                  all_removed.extend(removed)
              else:
                  skipped_dirs += 1
              print('')

          print('[INFO] 汇总：扫描目录 %d 个 | 已聚合 %d 个 | 已跳过 %d 个'
                % (len(dirs), merged_dirs, skipped_dirs))
          print('[INFO] 汇总：并入分片 %d 个 | 删除分片 %d 个 | 写入目标文件 %d 个'
                % (total_parts, len(all_removed), merged_dirs))
          if merged_dirs:
              print('[INFO] 汇总：聚合结果共 %d 行（各目录去重后的合计）' % total_lines)
              print('[INFO] 以下文件已被删除（内容已并入同目录的 %s）：' % TARGET_NAME)
              for src in all_removed:
                  print('[INFO]   - %s' % src)
          else:
              print('[INFO] 本次无任何目录需要聚合（幂等跳过，不产生提交）')
          PY

      - name: CommitAndPush
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- Branch)" ]; then
            echo "[INFO] Branch/ 下无变更，跳过提交（不推送）"
            exit 0
          fi
          echo "[INFO] git 检出的待提交变更（状态码：M=修改 A=新增 D=删除 ??=未跟踪）："
          git status --porcelain -- Branch | sed 's/^/       /'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Branch
          git commit -m "chore(migration): aggregate UploadFileList_*.txt into UploadFileList.txt [skip ci]"
          echo "[INFO] 本次提交："
          git show --stat --oneline HEAD | sed 's/^/       /'
          # 并发或其他推送可能已推进远端：rebase 后重试，最多 3 次
          for attempt in 1 2 3; do
            if git push origin HEAD:Migration; then
              echo "[PASS] 已提交到 Migration（第 ${attempt} 次尝试）：$(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "[WARN] 推送失败，rebase 后重试（第 ${attempt} 次）"
            git pull --rebase --autostash origin Migration
          done
          echo "[FAIL] 推送连续 3 次失败"
          exit 1
