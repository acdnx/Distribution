name: ArchiveUploadFileList

on:
  schedule:
    - cron: '0 21 * * *'      # 每天 UTC 21:00 = 北京时间次日 05:00（在采集 18:00 与上传 20:00–20:30 之后）
  workflow_dispatch:          # 手动补跑

permissions:
  contents: write

concurrency:
  group: ArchiveUploadFileList-Migration
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: CheckoutMigration
        uses: actions/checkout@v4
        with:
          ref: Migration
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: FetchDeleteBranch
        run: |
          git fetch --depth=1 origin +refs/heads/Delete:refs/remotes/origin/Delete
          echo "[INFO] Delete 分支 = $(git rev-parse --short origin/Delete)"

      - name: WorkflowContext
        run: |
          echo "[INFO] 触发事件 = ${{ github.event_name }}"
          echo "[INFO] 运行编号 = #${{ github.run_number }}（第 ${{ github.run_attempt }} 次尝试）"
          echo "[INFO] 操作者   = ${{ github.actor }}"
          echo "[INFO] 检出分支 = $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

      - name: ArchiveUploadFileList
        run: python3 .github/Python/ArchiveUploadFileList.py

      - name: CommitAndPush
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- Branch Archive)" ]; then
            echo "[INFO] Branch/ 与 Archive/ 下无变更，跳过提交（不推送）"
            exit 0
          fi
          echo "[INFO] git 检出的待提交变更（M=修改 A=新增 D=删除 ??=未跟踪）："
          git status --porcelain -- Branch Archive | sed 's/^/       /'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Branch Archive
          git commit -m "chore(migration): archive uploaded rows out of UploadFileList [skip ci]"
          echo "[INFO] 本次提交："
          git show --stat --oneline HEAD | sed 's/^/       /'
          for attempt in 1 2 3; do
            if git push origin HEAD:Migration; then
              echo "[PASS] 已提交到 Migration（第 ${attempt} 次尝试）：$(git rev-parse --short HEAD)"
              exit 0
            fi
            echo "[WARN] 推送失败，rebase 后重试（第 ${attempt} 次）"
            git pull --rebase --autostash origin Migration
          done
          echo "[FAIL] 推送连续 3 次失败"
          exit 1
