name: SupabaseImportWeekMvsv

on:
  schedule:
    # 每周日 UTC 00:20（北京 08:20）：整周数据在「次周日 00:00 UTC」跨过 14 天线，
    # 故每周日 0 点后跑一次即可覆盖刚满两周的那一周
    - cron: '20 0 * * 0'
  workflow_dispatch:
    inputs:
      code:
        description: 证券代码（如 IAU；留空 = 取 SecuMetaMapping.jsonl 中的全部 Code）
        type: string
        required: false
        default: ''
      week:
        description: 目标周 yyyyWW（如 202625；留空 = 取该证券最早一条记录所在的周）
        type: string
        required: false
        default: ''
      branch:
        description: 选择要执行工作流的分支（需包含 .github/Python/SupabaseImportWeekMvsv.py 及同目录依赖模块）
        type: string
        required: false
        default: quote
      pageSize:
        description: PostgREST 单页行数（Supabase 默认上限 1000）
        type: string
        required: false
        default: '1000'
      enableDelete:
        description: 导出成功后删除源库数据（数据迁移；false = 安全模式，只导出不删除）
        type: choice
        options:
          - 'false'
          - 'true'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: SupabaseImportWeekMvsv
  cancel-in-progress: false

jobs:
  SupabaseImportWeekMvsv:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # 检出所选分支：手动触发用输入的分支；定时触发（无 inputs）回落本工作流所属分支 quote
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'quote' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: RunSupabaseImportWeekMvsv
        env:
          # 必填：GitHub 写仓库令牌（经 Contents API 提交 .mvsv 到本分支用）
          GIT_COMMIT_TOKEN: ${{ secrets.GIT_COMMIT_TOKEN }}
          # 必填：Supabase 凭据（Data API 读 finv_quote_secu_kline_min 用）
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # 待导出证券：手动触发取输入（可逗号分隔多个）；留空则取脚本同目录
          # SecuMetaMapping.jsonl 中的全部 Code。多个时**逐个独立处理**
          # （各自查询 / 各自一份文件 / 各自一次提交）
          SECU_CODE: ${{ inputs.code }}
          # 目标周：留空则由脚本取该证券「最早一条记录」所在的周
          WEEK: ${{ inputs.week }}
          SUPABASE_PAGE_SIZE: ${{ inputs.pageSize || '1000' }}
          # 导出成功后是否删除源库中对应证券对应周的数据（数据迁移）。
          # **默认 false**：定时触发无 inputs，恒为 false ⇒ 定时任务永不删库；
          # 只有手动触发并显式选 true 才会删，且删前会复核「库中现值 == 本次导出的行」
          SUPABASE_ENABLE_DELETE: ${{ inputs.enableDelete || 'false' }}
          CURR_BRANCH: ${{ inputs.branch || 'quote' }}
          PYTHONIOENCODING: utf-8
        run: python3 .github/Python/SupabaseImportWeekMvsv.py
