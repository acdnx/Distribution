name: PullTestDataFiles

on:
  workflow_dispatch:
    inputs:
      source_owner:
        description: 源仓库属主（另一个仓库）
        type: string
        required: false
        default: ACANX
      source_repo:
        description: 源仓库名
        type: string
        required: false
        default: Distribution
      source_branch:
        description: 源分支（从它的 Data 目录拉取）
        type: string
        required: true
        default: quote
      target_branch:
        description: 目标分支（本仓，写到它的相同路径）
        type: string
        required: true
      pattern:
        description: 搬运哪些后缀（文件名通配，多个用逗号分隔）
        type: string
        required: false
        default: '*.json,*.mvsv,*.log'
      dry_run:
        description: 只列出同步计划、不写入
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: PullTestDataFiles-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  PullTestDataFiles:
    runs-on: ubuntu-latest
    steps:
      # 固定检出 dev：本工作流与脚本都随默认分支存放，这样无论从哪个 ref 触发，
      # 跑的都是同一份脚本（与「工具类脚本的家在 dev」这一约定一致）
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: RunPullTestDataFiles
        env:
          # 必填：GitHub 写仓库令牌（向目标分支提交测试数据用）
          GIT_COMMIT_TOKEN: ${{ secrets.GIT_COMMIT_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python3 .github/Python/PullTestDataFiles.py \
            --source-owner "${{ inputs.source_owner }}" \
            --source-repo "${{ inputs.source_repo }}" \
            --source-branch "${{ inputs.source_branch }}" \
            --target-branch "${{ inputs.target_branch }}" \
            --pattern "${{ inputs.pattern }}" \
            $ARGS
